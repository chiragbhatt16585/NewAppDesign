// Microscan Keystore Configuration
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
        release {
            // Microscan Play Store upload key
            storeFile file('Log2SpaceEndUserMicroscan.jks')
            storePassword 'log2space'
            keyAlias 'log2space'
            keyPassword 'log2space'
        }
} 