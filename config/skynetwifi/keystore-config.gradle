apply plugin: "com.android.application"

// Keystore configuration for Skynetwifi client
// NOTE: For now this uses the same keystore as GatewayFTTH (Log2spceGatewayFTTHKey_V3.jks).
// Replace it with your own release keystore when ready.
signingConfigs {
    debug {
        storeFile file('Log2spceGatewayFTTHKey_V3.jks')
        storePassword 'log2space'
        keyAlias 'log2space'
        keyPassword 'log2space'
    }
    release {
        storeFile file('Log2spceGatewayFTTHKey_V3.jks')
        storePassword 'log2space'
        keyAlias 'log2space'
        keyPassword 'log2space'
    }
}

