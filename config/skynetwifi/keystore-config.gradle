apply plugin: "com.android.application"

// Keystore configuration for Skynetwifi client
// Uses client keystore: Log2spceSkynetWifiKey_V3.jks
signingConfigs {
    debug {
        storeFile file('Log2spceSkynetWifiKey_V3.jks')
        storePassword 'log2space'
        keyAlias 'log2space'
        keyPassword 'log2space'
    }
    release {
        storeFile file('Log2spceSkynetWifiKey_V3.jks')
        storePassword 'log2space'
        keyAlias 'log2space'
        keyPassword 'log2space'
    }
}

