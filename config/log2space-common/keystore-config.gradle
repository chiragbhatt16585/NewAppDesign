// Log2space Keystore Configuration
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
    release {
      storeFile file('log2space.jks')
        storePassword 'log2space'
      keyAlias 'log2space'
        keyPassword 'log2space'
    }
}
