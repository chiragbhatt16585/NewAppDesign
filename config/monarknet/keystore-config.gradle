// Monarknet — release keystore (same as Gateway FTTH until a dedicated key is added)
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
    release {
        storeFile file('Log2spceGatewayFTTHKey_V3.jks')
        storePassword 'log2space'
        keyAlias 'log2space'
        keyPassword 'log2space'
    }
}
