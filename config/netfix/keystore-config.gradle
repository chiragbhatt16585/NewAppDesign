// Netfix Keystore Configuration
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
    release {
        storeFile file('Log2spaceNetfix.keystore')
        storePassword 'log2space'
        keyAlias 'my-key-alias'
        keyPassword 'log2space'
    }
}
